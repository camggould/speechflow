name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v0.1.0). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

# CGO is required (we use the mattn/go-sqlite3 driver with the sqlite_fts5
# build tag). Cross-compiling CGO from a single runner is fragile, so we
# build each (os,arch) on its native runner. Each matrix job produces
# its own tarball + .sha256, uploads them as artifacts, and a final
# `release` job downloads everything and publishes the GitHub Release.

jobs:
  build:
    name: ${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux,  arch: amd64, runner: ubuntu-latest }
          - { os: linux,  arch: arm64, runner: ubuntu-22.04-arm }
          - { os: darwin, arch: amd64, runner: macos-13 }
          - { os: darwin, arch: arm64, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Build embedded UI
        run: make ui

      - name: Resolve version
        id: ver
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'version=%s\n' "$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            printf 'version=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          BINARY="speechflow-${VERSION}-${GOOS}-${GOARCH}"
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X 'github.com/camggould/speechflow/internal/cli.buildVersion=${VERSION}' \
            -X 'github.com/camggould/speechflow/internal/cli.buildCommit=${COMMIT}' \
            -X 'github.com/camggould/speechflow/internal/cli.buildDate=${DATE}'"
          go build -trimpath -tags sqlite_fts5 -ldflags="${LDFLAGS}" -o "${BINARY}" ./cmd/speechflow
          ls -la "${BINARY}"
          file "${BINARY}" || true

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          set -euo pipefail
          BINARY="speechflow-${VERSION}-${GOOS}-${GOARCH}"
          TARBALL="${BINARY}.tar.gz"
          tar -czf "${TARBALL}" "${BINARY}"
          # install.sh consumes per-file `.sha256` written in
          # `shasum -c` format (`HASH  FILENAME`). shasum is present on
          # macOS runners; sha256sum on Linux. Both write the same format.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${TARBALL}" > "${TARBALL}.sha256"
          else
            sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          fi
          cat "${TARBALL}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: |
            speechflow-${{ steps.ver.outputs.version }}-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz
            speechflow-${{ steps.ver.outputs.version }}-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: assets-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la assets/

      - name: Resolve version
        id: ver
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'version=%s\n' "$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            printf 'version=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            assets/*.tar.gz
            assets/*.tar.gz.sha256
          body: |
            Pre-built binaries for linux/darwin × amd64/arm64.

            Install:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/camggould/speechflow/main/install.sh | sh
            ```

            Verify with the matching `.sha256` next to each tarball.
