# goreleaser config for speechflow.
#
# Produces per-(os,arch) tarballs and matching .sha256 files. The install.sh
# script depends on the exact naming below; do not rename without updating
# install.sh in lockstep.
#
# Layout this produces:
#   dist/speechflow-vX.Y.Z-linux-amd64.tar.gz
#   dist/speechflow-vX.Y.Z-linux-amd64.tar.gz.sha256
#   ... and so on for linux/arm64, darwin/amd64, darwin/arm64.
#
# Each tarball contains a single file: the binary named
#   speechflow-vX.Y.Z-<os>-<arch>
# (no top-level directory wrapping it — install.sh extracts in place).
#
# CGO is required for the mattn/go-sqlite3 driver. This config relies on
# being run on a native (matching) GOOS/GOARCH runner — see
# .github/workflows/release.yml.

version: 2

project_name: speechflow

before:
  hooks:
    # The release workflow runs `make ui` before goreleaser, but having
    # the hook here too keeps `goreleaser release --snapshot` usable
    # locally.
    - make ui

builds:
  - id: speechflow
    main: ./cmd/speechflow
    # Note: {{ .Tag }} keeps the leading "v" (e.g. "v0.2.0"); {{ .Version }}
    # strips it. install.sh expects the "v" — use .Tag here.
    binary: "speechflow-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    tags:
      - sqlite_fts5
    ldflags:
      - -s -w
      - -X 'github.com/camggould/speechflow/internal/cli.buildVersion={{ .Tag }}'
      - -X 'github.com/camggould/speechflow/internal/cli.buildCommit={{ .Commit }}'
      - -X 'github.com/camggould/speechflow/internal/cli.buildDate={{ .Date }}'
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # In split mode each runner builds only its own target; goreleaser
    # honours GOOS/GOARCH from the environment and skips the rest.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: speechflow
    ids:
      - speechflow
    formats:
      - tar.gz
    # Final filename:  speechflow-vX.Y.Z-<os>-<arch>.tar.gz
    name_template: "speechflow-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    # No wrapping directory — install.sh expects the binary at the
    # top of the tarball.
    wrap_in_directory: false
    files:
      - none*

checksum:
  # Per-file .sha256 alongside each archive — matches install.sh's
  # `${URL}.sha256` expectation. The aggregate SHA256SUMS file we
  # publish separately (added via release.extra_files below).
  disable: false
  algorithm: sha256
  split: true
  name_template: "{{ .ArtifactName }}.sha256"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: camggould
    name: speechflow
  prerelease: auto
  draft: false
  make_latest: "true"
  name_template: "{{ .Tag }}"
  header: |
    Pre-built binaries for linux/darwin × amd64/arm64.

    Install:
    ```sh
    curl -fsSL https://raw.githubusercontent.com/camggould/speechflow/main/install.sh | sh
    ```

    Verify with the matching `.sha256` next to each tarball.
